<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
>
    <link rel="stylesheet" href="css/style.css">
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
    
</head>

<body>

    <header>
        <h1>WeatherMap</h1>
        <p>Check the weather for any location.</p>
    </header>

    <main>
        <section>
            <h2>Find a Location</h2>

            <form id="weather-form">
                <label for="location">Location</label>
                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter a city or location"
                    required
                >

                <button type="submit">Get Weather</button>
            </form>

            <div id="loading-spinner" class="spinner" role="status" hidden>
    <span class="spinner-circle"></span>
    <span>Loading...</span>
</div>

<div id="alert-box" class="alert-card" role="alert" hidden></div>

            <p id="search-result" aria-live="polite"></p>

            <div id="weather-result" aria-live="polite">
</div>

<section id="favorites-section">
                <h2>Favorite Cities ⭐</h2>

                <button type="button" id="add-favorite">
                    Add to Favorites
                </button>

                <div id="favorites-list">
                    <p>No favorite cities yet.</p>
                </div>
            </section>

        </section>

        <div class="map-chat-layout">
            <section>
                <div id="map"></div>
            </section>

            <section id="chat-section">
                <h2>Ask the Weather AI 🤖</h2>
                <p>Search for a city first, then ask a question about its weather.</p>

                <div id="chat-messages" aria-live="polite"></div>

                <form id="chat-form">
                    <input
                        type="text"
                        id="chat-input"
                        placeholder="Ask me anything about this city's weather..."
                        maxlength="500"
                        required
                    >
                    <button type="submit" id="chat-send">Send</button>
                </form>
            </section>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/script.js"></script>

</body>
</html>
